name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["Upstream Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check 15-day interval
        id: check_interval
        run: |
          INTERVAL_DAYS=15
          INTERVAL_SEC=$((INTERVAL_DAYS * 86400))
          NOW_SEC=$(date -u +%s)
          LAST_FILE=".last-cf-deploy"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "$LAST_FILE" ]; then
            LAST_SEC=$(tr -d '[:space:]' < "$LAST_FILE")
            if echo "$LAST_SEC" | grep -qE '^[0-9]+$'; then
              ELAPSED=$((NOW_SEC - LAST_SEC))
              echo "Elapsed seconds: $ELAPSED / Required: $INTERVAL_SEC"
              if [ "$ELAPSED" -lt "$INTERVAL_SEC" ]; then
                echo "Less than $INTERVAL_DAYS days since last deploy. Skipping."
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Update wrangler.toml
        if: steps.check_interval.outputs.should_deploy == 'true'
        run: |
          cat << 'EOF' > wrangler.toml
          name = "edgtunel-mico"
          main = "_worker.js"
          compatibility_date = "2026-11-24"
          keep_vars = true

          [[kv_namespaces]]
          binding = "KV"
          id = "6d22a35ae09e425fbe46053dbb39f85e"

          [observability]
          enabled = true

          workers_dev = false
          preview_urls = false
          EOF

      - name: Deploy Worker
        if: steps.check_interval.outputs.should_deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Commit and push wrangler.toml and timestamp
        if: steps.check_interval.outputs.should_deploy == 'true'
        run: |
          date -u +%s > .last-cf-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml .last-cf-deploy
          if ! git diff --cached --quiet; then
            git commit -m "chore: update wrangler.toml and record deploy timestamp"
            git push origin HEAD:main
          fi
